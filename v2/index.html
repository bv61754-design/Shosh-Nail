<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شوش نيل — أظافر مركّبة تُفصّل على ذوقك ومقاسك | Shosh Nail</title>
<meta name="description" content="شوش نيل: سوّي اختبار الستايل ونبني لك طقم أظافرك المركّبة من إجاباتك — اللون والشكل والطول والنقشة والزخارف — أو اختاري تصميمًا جاهزًا. Take the style quiz and we build your press-on nail set from your answers.">
<meta name="theme-color" content="#C97B92">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20d='M12%202.6c3.1%200%204.9%201.9%204.9%204.7%200%202.6-.6%204.9-1%207.1-.5%202.8-1%205.3-3.9%205.3s-3.4-2.5-3.9-5.3c-.4-2.2-1-4.5-1-7.1%200-2.8%201.8-4.7%204.9-4.7Z'%20fill='%23C97B92'/%3E%3Cpath%20d='M9.6%206.7c1.3-1.1%203.5-1.1%204.8%200'%20stroke='%23FCF7F5'%20stroke-width='1.2'%20stroke-linecap='round'%20fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Reem+Kufi:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">

<style>
/* ---------------------------------------------------------------------
   Home-only layout. Every rule is prefixed .home-* and uses ONLY the
   tokens published in SPEC section 14, so it never collides with any
   other page and stays correct in both themes and both directions.
   Logical properties throughout — one rule serves RTL and LTR.
   --------------------------------------------------------------------- */

/* a class rule beats the UA sheet, so [hidden] needs saying out loud */
[hidden]{ display:none !important; }

/* ── reveal-on-scroll ─────────────────────────────────────────────────
   The class is added by home.js only when IntersectionObserver exists and
   the visitor has not asked for reduced motion, so content is never left
   invisible when JS or IO is unavailable. */
.home-rv{
  opacity:0;
  transform:translateY(18px);
  transition:opacity .24s var(--ease), transform .24s var(--ease);
  will-change:opacity, transform;
}
.home-rv.is-in{ opacity:1; transform:none; }
@media (prefers-reduced-motion:reduce){
  .home-rv,.home-rv.is-in{ opacity:1 !important; transform:none !important; }
}

/* ── hero ────────────────────────────────────────────────────────────── */
.home-hero{
  padding-block:clamp(28px,5vw,64px) clamp(44px,7vw,88px);
  overflow:hidden;
}
/* minmax(0,…) everywhere: the hero art is an <svg> with an intrinsic width of
   620, and an `auto` track would size itself to that and blow the page open
   on a phone. */
.home-hero-in{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:clamp(18px,3.6vw,26px);
  align-items:center;
}
/* desktop: the copy stacks in one column beside a full-height hand */
@media (min-width:900px){
  .home-hero-in{
    grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);
    grid-template-areas:"head art" "copy art";
    grid-template-rows:auto auto;
    align-content:center;
    column-gap:clamp(28px,4.5vw,54px);
    row-gap:18px;
  }
  .home-hero-head{ grid-area:head; align-self:end; }
  .home-hero-copy{ grid-area:copy; align-self:start; }
  .home-hero-art{ grid-area:art; align-self:center; }
}
.home-hero-head > * + *{ margin-block-start:14px; }
.home-hero-copy > * + *{ margin-block-start:16px; }
.home-hero-head .eyebrow{ align-items:start; margin-block-end:0; }
.home-hero-head .h1{ max-inline-size:15ch; }
.home-hero-copy .lead{ max-inline-size:56ch; }
.home-hero-btns{ margin-block-start:20px; }
@media (max-width:420px){
  .home-hero-btns{ flex-direction:column; align-items:stretch; }
  .home-hero-btns > .btn{ inline-size:100%; }
}

.home-notes{
  display:flex;
  flex-wrap:wrap;
  gap:8px 14px;
  margin-block-start:22px;
  list-style:none;
}
.home-note{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--ink-2);
  font-size:.85rem;
  font-weight:500;
  line-height:1.6;
}
.home-note .ico{ color:var(--rose-2); }

/* the live nail preview */
.home-hero-art{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  justify-items:center;
  align-items:center;
  min-inline-size:0;
}
.home-hero-art::before{
  content:"";
  position:absolute;
  inset-block-start:2%;
  inset-inline-start:50%;
  translate:-50% 0;
  inline-size:min(560px,104%);
  aspect-ratio:1/1;
  border-radius:50%;
  background:
    radial-gradient(closest-side,var(--glow-2),transparent 70%) 62% 28%/68% 68% no-repeat,
    radial-gradient(closest-side,var(--glow),transparent 72%);
  pointer-events:none;
}
.home-hero-stage{
  position:relative;
  z-index:1;
  inline-size:100%;
  min-inline-size:0;
  max-inline-size:520px;
}
/* the looks are stacked in one grid cell and cross-faded, so the hero never
   changes height as the set changes and only opacity is ever animated */
.home-hero-deck{ display:grid; }
.home-hero-look{
  grid-area:1 / 1;
  opacity:0;
  transition:opacity .5s var(--ease);
  pointer-events:none;
}
.home-hero-look.is-on{ opacity:1; }
.home-hero-look > svg,.home-hero-stage > svg,.home-hero-stage > img{
  inline-size:100%;
  block-size:auto;
  filter:drop-shadow(0 22px 34px rgba(74,43,57,.16));
}
.home-hero-stage > img{
  border-radius:var(--r-lg);
  aspect-ratio:4/3;
  object-fit:cover;
}

/* the look picker under the hand: dots she can drive herself */
.home-hero-nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-block-start:14px;
}
.home-hero-dot{
  position:relative;
  inline-size:9px;
  block-size:9px;
  padding:0;
  border:0;
  border-radius:50%;
  background:var(--line-2);
  cursor:pointer;
  transition:background-color var(--dur-2) var(--ease), transform var(--dur-2) var(--ease-pop);
}
.home-hero-dot::before{ content:""; position:absolute; inset:-11px; border-radius:50%; }
.home-hero-dot:hover{ background:var(--rose); }
.home-hero-dot[aria-pressed="true"]{ background:var(--rose-2); transform:scale(1.55); }
.home-hero-cap{
  margin-block-start:10px;
  text-align:center;
  font-size:.82rem;
  font-weight:700;
  color:var(--ink-3);
}
@media (prefers-reduced-motion:no-preference){
  .home-float{ animation:home-float 7.5s var(--ease) infinite; }
  @keyframes home-float{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%    { transform:translateY(-13px) rotate(-.5deg); }
  }
}
@media (prefers-reduced-motion:reduce){
  .home-float{ animation:none !important; transform:none !important; }
}

/* ── stats strip ─────────────────────────────────────────────────────── */
.home-statsec{ padding-block:0; }
.home-stats{
  /* one equal-width row whatever the owner leaves in the collection */
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:minmax(0,1fr);
  align-items:center;
  gap:clamp(4px,2vw,18px);
  padding-block:clamp(20px,3vw,30px);
  padding-inline:clamp(8px,2.4vw,26px);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  background:linear-gradient(160deg,var(--bg-2),var(--bg-4));
  box-shadow:var(--sh-1);
  list-style:none;
}
.home-stat{
  position:relative;
  text-align:center;
  padding-inline:clamp(4px,1.6vw,14px);
  min-inline-size:0;
}
.home-stat + .home-stat::before{
  content:"";
  position:absolute;
  inset-block:14%;
  inset-inline-start:0;
  inline-size:1px;
  background:linear-gradient(180deg,transparent,var(--line-2),transparent);
}
.home-stat-v{
  display:block;
  font-size:clamp(1.55rem,5.4vw,2.7rem);
  font-weight:800;
  line-height:1.15;
  color:var(--rose-3);
  font-variant-numeric:tabular-nums;
  direction:ltr;
  unicode-bidi:isolate;
}
.home-stat-l{
  display:block;
  margin-block-start:6px;
  font-size:clamp(.72rem,2vw,.88rem);
  line-height:1.55;
  color:var(--ink-2);
  text-wrap:balance;
}

/* ── numbered steps ──────────────────────────────────────────────────── */
.home-step{ position:relative; padding-block-start:8px; }
.home-step-n{
  display:inline-grid;
  place-items:center;
  inline-size:46px;
  block-size:46px;
  margin-block-end:14px;
  border-radius:50%;
  background:var(--rose-soft);
  color:var(--rose-3);
  font-size:1.12rem;
  font-weight:800;
  line-height:1;
  font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 6px var(--bg);
}
.home-step-t{ font-size:1.05rem; font-weight:700; line-height:1.5; color:var(--ink); }
.home-step-x{ margin-block-start:8px; font-size:.9rem; line-height:1.8; color:var(--ink-2); }
/* the hairline that threads the four steps together on wide screens */
@media (min-width:1000px){
  .home-steps{ position:relative; }
  .home-steps::before{
    content:"";
    position:absolute;
    inset-inline:12%;
    inset-block-start:31px;
    block-size:2px;
    background:linear-gradient(90deg,transparent,var(--line-2),var(--line-2),transparent);
  }
  .home-step{ z-index:1; }
}

/* ── features ────────────────────────────────────────────────────────── */
.home-feat{ padding:clamp(18px,2.6vw,26px); }
.home-feat-ico{
  display:inline-grid;
  place-items:center;
  inline-size:50px;
  block-size:50px;
  margin-block-end:14px;
  border-radius:var(--r);
  background:linear-gradient(145deg,var(--rose-soft),var(--gold-soft));
  color:var(--rose-3);
}
.home-feat-t{ font-size:1.03rem; font-weight:700; line-height:1.5; color:var(--ink); }
.home-feat-x{ margin-block-start:8px; font-size:.9rem; line-height:1.8; color:var(--ink-2); }

/* ── design cards (markup shared with the shop) ──────────────────────── */
.home-card-btns{ margin-block-start:4px; flex-wrap:nowrap; }
.home-card-btns > .btn{ flex:1 1 0; min-inline-size:0; padding-inline:10px; }
.home-card-btns > .btn-ghost{ border-color:var(--line-2); }
.home-card-btns > .btn-ghost:hover{ border-color:var(--rose); color:var(--rose-3); }

/* ── colour teaser ───────────────────────────────────────────────────── */
.home-colors-in{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:clamp(20px,3vw,40px);
  align-items:center;
}
@media (min-width:860px){
  .home-colors-in{ grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); }
}
.home-colors-copy .eyebrow{ align-items:start; }
.home-sw-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:clamp(8px,1.4vw,12px);
  justify-content:center;
  /* caps the strip at nine per row so 18 shades read as two even bands */
  max-inline-size:508px;
  margin-inline:auto;
}
.home-sw{
  cursor:default;
  inline-size:clamp(30px,6.4vw,44px);
  block-size:clamp(30px,6.4vw,44px);
}
.home-sw:hover{ transform:none; }

/* ── testimonials ────────────────────────────────────────────────────── */
.home-quote{ padding:clamp(18px,2.6vw,26px); }
.home-quote-x{
  margin-block-start:12px;
  font-size:.95rem;
  line-height:1.9;
  color:var(--ink-2);
}
.home-quote-w{
  display:flex;
  align-items:center;
  gap:10px;
  margin-block-start:16px;
  padding-block-start:14px;
  border-block-start:1px solid var(--line);
}
.home-quote-av{
  display:grid;
  place-items:center;
  flex:0 0 auto;
  inline-size:38px;
  block-size:38px;
  border-radius:50%;
  background:var(--rose-soft);
  color:var(--rose-3);
  font-weight:800;
  font-size:.95rem;
  line-height:1;
}
.home-quote-n{ font-weight:700; color:var(--ink); font-size:.92rem; }

/* ── closing CTA band ────────────────────────────────────────────────── */
.home-band{
  position:relative;
  overflow:hidden;
  padding:clamp(30px,5.4vw,64px) clamp(20px,4vw,52px);
  border-radius:var(--r-xl);
  background:linear-gradient(135deg,var(--rose-2),var(--rose));
  color:var(--on-rose);
  text-align:center;
  box-shadow:var(--sh-2);
}
.home-band::before{
  content:"";
  position:absolute;
  inset-block-start:-40%;
  inset-inline-end:-12%;
  inline-size:min(420px,72%);
  aspect-ratio:1/1;
  border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent 70%);
  pointer-events:none;
}
.home-band > *{ position:relative; z-index:1; }
.home-band .h2,.home-band .lead{ color:var(--on-rose); }
.home-band .lead{
  max-inline-size:56ch;
  margin-inline:auto;
  margin-block-start:12px;
  opacity:.92;
}
.home-band .btns{ justify-content:center; margin-block-start:26px; }
.home-band .btn-pri{
  background:var(--bg-2);
  background-image:none;
  color:var(--rose-3);
  box-shadow:var(--sh-1);
}
.home-band .btn-pri:hover{ background:var(--bg-2); color:var(--rose-3); }
.home-band .btn-ghost{
  color:var(--on-rose);
  border:1px solid rgba(255,255,255,.55);
  background:transparent;
}
.home-band .btn-ghost:hover{ background:rgba(255,255,255,.14); color:var(--on-rose); }

/* ── the style quiz: the second front door ───────────────────────────────
   She arrives from an Instagram link, so this is not a link in a list: the
   first question is already on the page, in real nails, and tapping one both
   answers it and opens the quiz on question two. */
.home-quizsec{ padding-block:clamp(6px,1.6vw,18px); }
.home-quiz{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:clamp(18px,3vw,34px);
  align-items:center;
  padding:clamp(20px,3.4vw,34px);
  border:1px solid var(--line-2);
  border-radius:var(--r-xl);
  background:linear-gradient(150deg,var(--rose-soft),var(--gold-soft) 96%);
  box-shadow:var(--sh-1);
}
@media (min-width:860px){
  /* the pair is centred as a pair: a 1fr copy column would leave a canyon of
     empty ground between the paragraph and the panel */
  .home-quiz{
    grid-template-columns:minmax(0,540px) minmax(0,440px);
    justify-content:center;
    column-gap:clamp(26px,4vw,56px);
    align-items:center;
  }
}
.home-quiz-copy > * + *{ margin-block-start:12px; }
.home-quiz-copy .eyebrow{ align-items:start; margin-block-end:0; }
.home-quiz-copy .h2{ font-size:clamp(1.35rem,3.4vw,2.05rem); }
.home-quiz-copy .lead{ font-size:.96rem; max-inline-size:52ch; }
.home-quiz-proof{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:.84rem;
  font-weight:700;
  color:var(--rose-3);
}
.home-quiz-proof .ico{ color:var(--gold); }

/* the first question, live on the page */
.home-quiz-start{
  display:flex;
  flex-direction:column;
  gap:11px;
  min-inline-size:0;
  padding:clamp(13px,2.6vw,18px);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  background:var(--bg-2);
  box-shadow:var(--sh-1);
}
.home-quiz-tease{ font-size:.9rem; font-weight:700; line-height:1.5; color:var(--ink); }
.home-quiz-tiles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
.home-qtile{
  --sn-ring-r:var(--r-sm);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:6px;
  min-inline-size:0;
  padding:9px 6px 10px;
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  background:var(--bg-4);
  color:var(--ink);
  font:inherit;
  text-align:center;
  cursor:pointer;
  transition:border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease);
}
.home-qtile:hover{ border-color:var(--rose); background:var(--bg-2); }
.home-qtile-art{
  display:grid;
  place-items:center;
  inline-size:100%;
  block-size:clamp(58px,15vw,74px);
}
@media (min-width:860px){ .home-qtile-art{ block-size:96px; } }
/* SN.Nail sizes its own <svg> with a style attribute, so the box it has to
   live inside has to say so louder */
.home-qtile-art > svg,
.quiz-art > svg,
.quiz-recipe-art > svg{
  inline-size:auto !important;
  max-inline-size:100% !important;
  block-size:100% !important;
}
.home-qtile-t{ font-size:.78rem; font-weight:700; line-height:1.4; }
.home-quiz-btns{ margin-block-start:2px; align-items:center; gap:9px 14px; }
.home-quiz-btns > .btn{ flex:1 1 auto; justify-content:center; }
.home-quiz-note{
  display:inline-flex;
  align-items:center;
  gap:7px;
  inline-size:100%;
  justify-content:center;
  font-size:.8rem;
  font-weight:600;
  color:var(--ink-2);
}
.home-quiz-note .ico{ color:var(--rose-2); }

/* ── most ordered: a shop window on a phone, a grid on a desktop ─────── */
.home-proof{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-block-start:14px;
}
.home-top-rail{
  display:flex;
  gap:14px;
  scroll-snap-type:x mandatory;
  scroll-padding-inline:2px;
  padding-inline:2px;
  padding-block-end:6px;
  margin-inline:-2px;
}
.home-top-rail > *{ flex:0 0 min(78%,286px); scroll-snap-align:center; }
@media (min-width:700px){
  .home-top-rail{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:clamp(14px,2.2vw,24px);
    overflow:visible;
  }
  .home-top-rail > *{ flex:none; }
}
@media (min-width:1000px){
  .home-top-rail{ grid-template-columns:repeat(4,minmax(0,1fr)); }
}
@media (prefers-reduced-motion:reduce){
  .home-top-rail{ scroll-snap-type:none; }
  .home-hero-look{ transition:none !important; }
}

/* ═════════════════════════════════════════════════════════════════════
   THE STYLE QUIZ (markup from SN.Quiz — assets/js/quiz.js)
   Lives in an SN.UI.modal, so the shell owns focus, ESC and the backdrop
   and only the inside of the dialog is styled here.
   ═════════════════════════════════════════════════════════════════════ */
.quiz-modal{ max-inline-size:840px; }
.quiz{
  display:flex;
  flex-direction:column;
  gap:clamp(12px,2.4vw,18px);
  /* one steady frame: short questions do not make the dialog shrink and
     jump under her thumb between taps */
  min-block-size:min(54vh,400px);
}

/* the progress row: back · dots · a pad that matches the back button, so the
   dots stay dead centre whichever way the page reads */
.quiz-top{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
}
.quiz-back{ justify-self:start; padding-inline:10px 12px; }
.quiz-back.is-hidden{ visibility:hidden; pointer-events:none; }
/* base.css already mirrors .ico-chevron in RTL so it points "forward";
   "back" is the other way in both scripts, hence one unscoped flip. */
.quiz-back-ico{ display:inline-flex; transform:scaleX(-1); }
.quiz-dots{ display:flex; align-items:center; gap:7px; }
.quiz-dot{
  inline-size:8px;
  block-size:8px;
  border-radius:50%;
  background:var(--line-2);
  transition:background-color var(--dur-2) var(--ease), transform var(--dur-2) var(--ease-pop);
}
.quiz-dot.is-done{ background:var(--rose); }
.quiz-dot.is-on{ background:var(--rose-2); transform:scale(1.5); }

/* a question */
.quiz-screen{ display:flex; flex-direction:column; gap:9px; flex:1 1 auto; min-inline-size:0; }
.quiz-eyebrow{ margin-block-end:0; }
.quiz-q{
  font-size:clamp(1.18rem,4.2vw,1.62rem);
  font-weight:700;
  line-height:1.45;
  color:var(--ink);
}
.quiz-hint{ font-size:.88rem; line-height:1.75; color:var(--ink-2); max-inline-size:54ch; }
.quiz-opts{ display:grid; gap:clamp(9px,2vw,14px); margin-block-start:6px; }
.quiz-cols-2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.quiz-cols-3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
@media (min-width:720px){
  .quiz-cols-2{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  .quiz-cols-3{ grid-template-columns:repeat(6,minmax(0,1fr)); }
}
.quiz-opt{
  --sn-ring-r:var(--r);
  display:flex;
  flex-direction:column;
  align-items:center;
  /* top-aligned: a label that wraps to two lines must not shove its picture
     up out of line with the tile beside it */
  justify-content:flex-start;
  gap:9px;
  padding:12px 8px 13px;
  min-inline-size:0;
  border:1px solid var(--line);
  border-radius:var(--r);
  background:var(--bg-2);
  color:var(--ink);
  font:inherit;
  text-align:center;
  cursor:pointer;
  transition:border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease);
}
.quiz-opt:hover{ border-color:var(--rose); }
.quiz-opt[aria-pressed="true"]{ border-color:var(--rose); background:var(--rose-soft); }
.quiz-opt-t{ font-size:.85rem; font-weight:700; line-height:1.45; }
.quiz-art{
  display:grid;
  place-items:center;
  inline-size:100%;
  block-size:clamp(76px,22vw,100px);
}
@media (min-width:720px){ .quiz-art{ block-size:116px; } }
/* one unbroken row: circles that wrap stop reading as a palette */
.quiz-art-strip{
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding-inline:2px;
}
.quiz-sw{
  flex:0 0 auto;
  inline-size:clamp(24px,6.6vw,32px);
  block-size:clamp(24px,6.6vw,32px);
  border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), var(--sh-1);
}
.quiz-skin{
  inline-size:clamp(52px,15vw,64px);
  block-size:clamp(52px,15vw,64px);
  border-radius:50%;
  box-shadow:inset 0 -7px 15px rgba(74,43,57,.18), var(--sh-1);
}
.quiz-ico{
  display:grid;
  place-items:center;
  inline-size:60px;
  block-size:60px;
  border-radius:var(--r);
  background:linear-gradient(145deg,var(--rose-soft),var(--gold-soft));
  color:var(--rose-3);
}

/* the beat before the reveal */
.quiz-wait{
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:16px;
  padding-block:clamp(26px,8vw,58px);
}
.quiz-wait-fan{ display:flex; align-items:flex-end; gap:10px; }
.quiz-wait-n{ inline-size:32px; block-size:50px; border-radius:16px 16px 9px 9px; }
.quiz-wait-n:nth-child(2){ block-size:64px; }
.quiz-wait-t{ font-size:1.12rem; font-weight:700; color:var(--ink); }

/* the reveal */
.quiz-done{ position:relative; align-items:center; text-align:center; gap:8px; }
.quiz-done > *{ position:relative; z-index:1; }
.quiz-done > .sn-burst{ z-index:0; --sn-burst-y:38%; }
.quiz-name{
  font-size:clamp(1.5rem,5.6vw,2.2rem);
  font-weight:700;
  line-height:1.3;
  color:var(--rose-3);
}
.quiz-hero{
  inline-size:100%;
  max-inline-size:min(600px,100%);
  margin-inline:auto;
  margin-block:2px 4px;
}
/* on a laptop the two hands would otherwise eat the whole viewport and push
   the price and the buttons under the fold */
@media (min-width:700px){ .quiz-hero{ max-inline-size:min(430px,100%); } }
.quiz-hero > svg{
  inline-size:100%;
  block-size:auto;
  filter:drop-shadow(0 16px 26px rgba(74,43,57,.15));
}
.quiz-blurb{ text-align:center; margin-inline:auto; }
.quiz-picks{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-block-start:2px; }
.quiz-price{ font-size:1.3rem; font-weight:800; color:var(--rose-3); margin-block-start:4px; }
.quiz-actions{ justify-content:center; inline-size:100%; margin-block-start:8px; }
.quiz-actions > *{ flex:1 1 210px; justify-content:center; }
.quiz-note{ max-inline-size:48ch; }

/* the three versions of her set — one row of taps above the card */
.quiz-vars{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(0,1fr));
  gap:6px;
  inline-size:100%;
  padding:5px;
  border:1px solid var(--line);
  border-radius:var(--r-full);
  background:var(--bg-3);
}
.quiz-var{
  --sn-ring-r:var(--r-full);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
  min-inline-size:0;
  padding:8px 6px;
  border:0;
  border-radius:var(--r-full);
  background:transparent;
  color:var(--ink-2);
  font:inherit;
  cursor:pointer;
  transition:background-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
}
.quiz-var.is-on{ background:var(--bg-2); color:var(--ink); box-shadow:var(--sh-1); }
.quiz-var-t{ font-size:.76rem; font-weight:700; line-height:1.3; }
.quiz-var-n{
  font-size:.7rem;
  line-height:1.3;
  color:var(--ink-3);
  max-inline-size:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.quiz-var.is-on .quiz-var-n{ color:var(--rose-2); }

/* the screenshot: everything worth posting sits inside this one frame */
.quiz-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  inline-size:100%;
  padding:clamp(14px,3.4vw,22px) clamp(12px,3vw,20px) clamp(12px,2.6vw,18px);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  background:linear-gradient(168deg,var(--bg-2),var(--bg-4));
  box-shadow:var(--sh-1);
}
.quiz-sub{
  font-size:.8rem;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--ink-3);
}
.quiz-brand{
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:4px 10px;
  inline-size:100%;
  margin-block-start:8px;
  padding-block-start:11px;
  border-block-start:1px solid var(--line);
}
.quiz-brand-n{ font-size:.98rem; font-weight:700; color:var(--rose-3); }
.quiz-brand-h{ font-size:.82rem; font-weight:600; color:var(--gold); }

/* her skin, on her set */
.quiz-skinbox{ display:flex; flex-direction:column; align-items:center; gap:7px; margin-block-start:4px; }
.quiz-skin-t{ margin:0; }
.quiz-skins{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
.quiz-skin-b{
  --sn-ring-r:50%;
  inline-size:30px;
  block-size:30px;
  padding:0;
  border:1px solid var(--line-2);
  border-radius:50%;
  cursor:pointer;
  box-shadow:inset 0 -5px 11px rgba(74,43,57,.16);
}
.quiz-skin-b[aria-pressed="true"]{ border-color:var(--rose-2); }

/* the set read out nail by nail — the part that makes it orderable */
.quiz-recipe{
  inline-size:100%;
  margin-block-start:6px;
  padding:clamp(12px,2.6vw,16px);
  border:1px solid var(--line);
  border-radius:var(--r);
  background:var(--bg-2);
  text-align:start;
}
.quiz-recipe-t{
  font-size:.92rem;
  font-weight:700;
  color:var(--ink);
  margin-block-end:8px;
}
.quiz-recipe-list{ display:grid; gap:6px; list-style:none; }
@media (min-width:620px){ .quiz-recipe-list{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 16px; } }
.quiz-recipe-row{
  display:flex;
  align-items:center;
  gap:10px;
  min-inline-size:0;
  padding-block:4px;
}
.quiz-recipe-art{
  flex:0 0 auto;
  display:grid;
  place-items:center;
  inline-size:32px;
  block-size:46px;
}
.quiz-recipe-txt{ display:flex; flex-direction:column; min-inline-size:0; }
.quiz-recipe-n{ font-size:.82rem; font-weight:700; color:var(--ink); line-height:1.4; }
.quiz-recipe-x{ font-size:.76rem; color:var(--ink-2); line-height:1.5; }

/* share · save · retake */
.quiz-more{
  justify-content:center;
  flex-wrap:wrap;
  gap:6px 10px;
  inline-size:100%;
  margin-block-start:6px;
}
</style>
