<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأسئلة والتواصل — شوش نيل | Help &amp; Contact · Shosh Nail</title>
<meta name="description" content="كل اللي تحتاجين تعرفينه عن أظافر شوش نيل: التركيب خطوة بخطوة، مدة الثبات، الإزالة، المقاسات، الشحن والدفع — مع أرقام التواصل المباشر على واتساب. Everything about applying, caring for and ordering Shosh Nail press-on sets, plus direct contact.">
<meta name="theme-color" content="#C97B92">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20d='M12%202.6c3.1%200%204.9%201.9%204.9%204.7%200%202.6-.6%204.9-1%207.1-.5%202.8-1%205.3-3.9%205.3s-3.4-2.5-3.9-5.3c-.4-2.2-1-4.5-1-7.1%200-2.8%201.8-4.7%204.9-4.7Z'%20fill='%23C97B92'/%3E%3Cpath%20d='M9.6%206.7c1.3-1.1%203.5-1.1%204.8%200'%20stroke='%23FCF7F5'%20stroke-width='1.2'%20stroke-linecap='round'%20fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Reem+Kufi:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">

<style>
/* ---------------------------------------------------------------------
   FAQ-only layout. Every selector is prefixed .faq-* (the single exception
   is the shared [hidden] guard), every value comes from the tokens in
   SPEC section 14, and every box uses logical properties so one rule
   serves both RTL and LTR.
   --------------------------------------------------------------------- */

/* a class rule beats the UA sheet, so [hidden] needs saying out loud */
[hidden]{ display:none !important; }

/* ── hero ───────────────────────────────────────────────────────────── */
.faq-hero{
  padding-block:clamp(26px,4.5vw,54px) clamp(18px,3vw,32px);
  overflow:hidden;                 /* .glow::before is 116% wide on purpose */
}
.faq-hero .sec-head{ margin-block-end:0; }
.faq-hero .h1{ max-inline-size:17ch; }
.faq-hero .lead{ max-inline-size:58ch; }

.faq-searchbox{
  margin-block-start:clamp(18px,3vw,26px);
  max-inline-size:660px;
}
.faq-search > .input{
  min-block-size:56px;
  border-radius:var(--r-full);
  padding-inline:50px;
  font-size:1rem;
  background:var(--bg-2);
  box-shadow:var(--sh-1);
}
.faq-search .search-ico{ inset-inline-start:17px; color:var(--rose-2); }
.faq-search-x{
  position:absolute;
  inset-inline-end:8px;
  color:var(--ink-3);
}
.faq-search-x:hover{ color:var(--rose-3); }

.faq-jump{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-block-start:16px;
}
.faq-jump .chip{ text-decoration:none; }

/* ── question list ──────────────────────────────────────────────────── */
.faq-bar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px 16px;
  margin-block-end:6px;
}
.faq-bar .tabs{ margin-block-end:0; flex:1 1 320px; min-inline-size:0; }
.faq-count{
  flex:0 0 auto;
  font-size:.82rem;
  font-weight:700;
  color:var(--ink-3);
}
.faq-tab-dim{ opacity:.5; }

.faq-item{ scroll-margin-block-start:calc(var(--hdr) + 24px); }
.faq-q{ margin:0; font-size:inherit; font-weight:inherit; line-height:inherit; }
.faq-q .acc-head{ inline-size:100%; }
.faq-q-t{ flex:1 1 auto; min-inline-size:0; }
.faq-chev{ flex:0 0 auto; display:inline-flex; }
.faq-q-n{
  flex:0 0 auto;
  font-size:.7rem;
  font-weight:800;
  color:var(--rose-2);
  background:var(--rose-soft);
  border-radius:var(--r-full);
  padding-block:3px;
  padding-inline:9px;
  white-space:nowrap;
}
@media (max-width:600px){ .faq-q-n{ display:none; } }

/* the h3 wrapper breaks base.css's `.acc-item.is-open > .acc-head` reach,
   so the chevron + the collapsed-content guard are restated here */
.faq-item.is-open .acc-head .ico-chevron{ transform:rotate(90deg); }
[dir="rtl"] .faq-item.is-open .acc-head .ico-chevron{ transform:scaleX(-1) rotate(90deg); }

/* a collapsed panel must be out of the tab order, not just visually clipped */
.faq-item .acc-body > *{
  visibility:hidden;
  transition:visibility 0s linear var(--dur);
}
.faq-item.is-open .acc-body > *{
  visibility:visible;
  transition-delay:0s;
}

.faq-a p + p{ margin-block-start:12px; }
.faq-ol{
  list-style:none;
  counter-reset:faq-a;
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-block:4px;
}
.faq-ol > li{
  counter-increment:faq-a;
  position:relative;
  padding-inline-start:34px;
}
.faq-ol > li::before{
  content:counter(faq-a);
  position:absolute;
  inset-inline-start:0;
  inset-block-start:.35em;
  inline-size:24px;
  block-size:24px;
  display:grid;
  place-items:center;
  border-radius:var(--r-full);
  background:var(--rose-soft);
  color:var(--rose-3);
  font-size:.72rem;
  font-weight:800;
  line-height:1;
  font-variant-numeric:tabular-nums;
}

.faq-a-foot{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin-block-start:16px;
  padding-block-start:12px;
  border-block-start:1px solid var(--line);
}
.faq-a-cat{ margin-inline-end:auto; }

.faq-hl{
  background:var(--gold-soft);
  color:inherit;
  border-radius:4px;
  padding-inline:2px;
  box-shadow:0 0 0 1px var(--gold-soft);
}

/* ── the step-by-step guide ─────────────────────────────────────────── */
.faq-steps{
  display:grid;
  gap:14px;
  grid-template-columns:1fr;
  counter-reset:faq-s;
}
@media (min-width:620px){ .faq-steps{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1000px){ .faq-steps{ grid-template-columns:repeat(4,minmax(0,1fr)); } }

.faq-step{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:clamp(16px,2.2vw,20px);
  padding-block-start:clamp(20px,2.6vw,24px);
  background:var(--bg-2);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--sh-1);
  overflow:hidden;
}
.faq-step::after{                  /* the oversized ghost numeral */
  content:attr(data-n);
  position:absolute;
  inset-block-start:-14px;
  inset-inline-end:-6px;
  font-family:var(--font);
  font-size:5.2rem;
  font-weight:800;
  line-height:1;
  color:var(--rose);
  opacity:.11;
  pointer-events:none;
  font-variant-numeric:tabular-nums;
}
.faq-step-ico{
  display:grid;
  place-items:center;
  inline-size:42px;
  block-size:42px;
  border-radius:var(--r-sm);
  background:var(--rose-soft);
  color:var(--rose-3);
  flex:0 0 auto;
}
.faq-step-n{
  font-size:.72rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--rose-2);
}
.faq-step-t{ font-size:1rem; font-weight:700; color:var(--ink); line-height:1.55; }
.faq-step-x{ font-size:.88rem; color:var(--ink-2); line-height:1.75; }

.faq-guide-foot{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  margin-block-start:clamp(18px,2.6vw,26px);
}

.faq-tips{
  display:grid;
  gap:12px;
  grid-template-columns:1fr;
  margin-block-start:14px;
}
@media (min-width:560px){ .faq-tips{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1000px){ .faq-tips{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
.faq-tip{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:14px;
  border-radius:var(--r-sm);
  background:var(--bg-2);
  border:1px solid var(--line);
}
.faq-tip .ico{ color:var(--gold); margin-block-start:2px; }
.faq-tip-t{ font-size:.92rem; font-weight:700; color:var(--ink); }
.faq-tip-x{ font-size:.84rem; color:var(--ink-2); line-height:1.7; }

.faq-remove{ margin-block-start:clamp(18px,2.6vw,26px); }
.faq-remove .faq-remove-b{ display:flex; flex-direction:column; gap:6px; }
.faq-remove-t{ font-weight:800; color:var(--ink); }

.faq-more{ margin-block-start:clamp(18px,2.6vw,26px); }
/* these chips carry whole questions, not one-word filters, so they wrap
   instead of running off the side of a narrow phone */
.faq-more .chip{
  max-inline-size:100%;
  white-space:normal;
  text-align:start;
}
.faq-more-t{
  font-size:.8rem;
  font-weight:800;
  letter-spacing:.04em;
  color:var(--ink-3);
  margin-block-end:10px;
}

/* ── contact + ask ──────────────────────────────────────────────────── */
.faq-two{
  display:grid;
  gap:clamp(16px,2.6vw,24px);
  grid-template-columns:1fr;
  align-items:start;
}
@media (min-width:960px){ .faq-two{ grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); } }

.faq-card-h{
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-block-end:16px;
}
.faq-card-h .ico{ color:var(--rose-2); margin-block-start:3px; }
.faq-card-t{ font-size:1.15rem; font-weight:800; color:var(--ink); line-height:1.5; }
.faq-card-x{ font-size:.88rem; color:var(--ink-2); line-height:1.75; margin-block-start:2px; }

.faq-wa{ margin-block-end:12px; }
.faq-wa .ico{ inline-size:22px; block-size:22px; }

.faq-links{
  display:grid;
  gap:10px;
  grid-template-columns:1fr;
}
@media (min-width:520px){ .faq-links{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.faq-link{
  display:flex;
  align-items:center;
  gap:10px;
  padding-block:11px;
  padding-inline:14px;
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  background:var(--bg-2);
  color:var(--ink);
  text-decoration:none;
  min-inline-size:0;
  transition:border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.faq-link:hover{ border-color:var(--rose); background:var(--bg-4); color:var(--ink); }
.faq-link .ico{ color:var(--rose-2); flex:0 0 auto; }
.faq-link-b{ display:flex; flex-direction:column; min-inline-size:0; }
.faq-link-t{ font-size:.8rem; font-weight:700; color:var(--ink-2); }
.faq-link-v{
  font-size:.9rem;
  font-weight:700;
  color:var(--ink);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.faq-info{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-block-start:18px;
  padding-block-start:16px;
  border-block-start:1px solid var(--line);
}
.faq-info-row{ display:flex; gap:10px; align-items:flex-start; }
.faq-info-row .ico{ color:var(--rose-2); margin-block-start:3px; flex:0 0 auto; }
.faq-info-t{ font-size:.78rem; font-weight:800; color:var(--ink-3); }
.faq-info-v{ font-size:.92rem; color:var(--ink); line-height:1.7; }

.faq-ask-form{ display:flex; flex-direction:column; gap:14px; }
.faq-ask-foot{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
}
.faq-ask-note{ flex:1 1 200px; min-inline-size:0; }

@media (prefers-reduced-motion:reduce){
  .faq-item .acc-body > *{ transition:none; }
}
</style>

<script defer src="assets/js/data.js"></script>
<script defer src="assets/js/store.js"></script>
<script defer src="assets/js/i18n.js"></script>
<script defer src="assets/js/nail-art.js"></script>
<script defer src="assets/js/nail-gloss.js"></script>
<script defer src="assets/js/nail-render.js"></script>
<script defer src="assets/js/ui.js"></script>
<script defer src="assets/js/checkout.js"></script>
<script defer src="assets/js/faq.js"></script>
</head>

<body data-page="faq">
<a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
<div id="sn-announce"></div>
<header id="sn-header"></header>

<main id="main">

  <!-- ── hero + search ────────────────────────────────────────────── -->
  <section class="sec sec-sm faq-hero glow">
    <div class="wrap">
      <div class="sec-head sec-head-start">
        <p class="eyebrow" data-i18n="faq.eyebrow"></p>
        <h1 class="h1 display" data-i18n="faq.title"></h1>
        <p class="lead" data-i18n="faq.lead"></p>

        <div class="faq-searchbox">
          <div class="search faq-search">
            <span class="search-ico" id="faq-search-ico" aria-hidden="true"></span>
            <label class="sr-only" for="faq-q" data-i18n="faq.searchLabel"></label>
            <input class="input" id="faq-q" type="search" autocomplete="off"
                   spellcheck="false" data-i18n-ph="faq.searchPh">
            <button class="icon-btn faq-search-x" id="faq-q-clear" type="button"
                    hidden data-i18n-aria="faq.clearSearch"></button>
          </div>
        </div>

        <nav class="faq-jump" id="faq-jump" data-i18n-aria="faq.jumpLabel"></nav>
      </div>
    </div>
  </section>

  <!-- ── questions ────────────────────────────────────────────────── -->
  <section class="sec sec-sm" id="faq-questions">
    <div class="wrap">
      <div class="faq-bar">
        <div class="tabs" id="faq-tabs" role="group" data-i18n-aria="faq.catsLabel"></div>
        <p class="faq-count" id="faq-count" aria-live="polite"></p>
      </div>

      <div class="accordion" id="faq-list"></div>

      <div class="empty" id="faq-empty" hidden>
        <span class="empty-ico" id="faq-empty-ico" aria-hidden="true"></span>
        <p class="empty-t" data-i18n="faq.noneT"></p>
        <p class="empty-x" data-i18n="faq.noneX"></p>
        <button class="btn btn-line btn-sm" id="faq-reset" type="button" data-i18n="faq.clearAll"></button>
      </div>
    </div>
  </section>

  <!-- ── application guide ────────────────────────────────────────── -->
  <section class="sec sec-alt sec-line" id="faq-guide">
    <div class="wrap">
      <div class="sec-head sec-head-start">
        <p class="eyebrow" data-i18n="faq.guideEyebrow"></p>
        <h2 class="h2 display" data-i18n="faq.guideTitle"></h2>
        <p class="lead" data-i18n="faq.guideLead"></p>
      </div>

      <ol class="faq-steps" id="faq-steps"></ol>

      <div class="faq-guide-foot" id="faq-guide-foot"></div>

      <div class="mt-3">
        <h3 class="h3 display" data-i18n="faq.tipsTitle"></h3>
        <div class="faq-tips" id="faq-tips"></div>
      </div>

      <div class="note faq-remove" id="faq-remove"></div>

      <div class="faq-more" id="faq-more" hidden>
        <p class="faq-more-t" data-i18n="faq.moreTitle"></p>
        <div class="chips" id="faq-more-chips"></div>
      </div>
    </div>
  </section>

  <!-- ── contact card + ask box ───────────────────────────────────── -->
  <section class="sec" id="faq-contact">
    <div class="wrap">
      <div class="sec-head sec-head-start">
        <p class="eyebrow" data-i18n="faq.contactEyebrow"></p>
        <h2 class="h2 display" data-i18n="faq.contactTitle"></h2>
        <p class="lead" data-i18n="faq.contactLead"></p>
      </div>

      <div class="faq-two">
        <div class="panel" id="faq-card"></div>

        <div class="panel" id="faq-ask">
          <div class="faq-card-h">
            <span id="faq-ask-ico" aria-hidden="true"></span>
            <div>
              <p class="faq-card-t" data-i18n="faq.askTitle"></p>
              <p class="faq-card-x" data-i18n="faq.askLead"></p>
            </div>
          </div>

          <form class="faq-ask-form" id="faq-ask-form" novalidate>
            <div class="field">
              <label class="label" for="faq-ask-name" data-i18n="faq.askName"></label>
              <input class="input" id="faq-ask-name" type="text" autocomplete="name"
                     maxlength="60" data-i18n-ph="faq.askNamePh"
                     aria-describedby="faq-ask-name-err">
              <p class="field-err" id="faq-ask-name-err" role="alert"></p>
            </div>

            <div class="field">
              <label class="label" for="faq-ask-cat" data-i18n="faq.askCat"></label>
              <select class="select" id="faq-ask-cat"></select>
            </div>

            <div class="field">
              <label class="label" for="faq-ask-q" data-i18n="faq.askQ"></label>
              <textarea class="textarea" id="faq-ask-q" rows="4" maxlength="900"
                        data-i18n-ph="faq.askQPh" aria-describedby="faq-ask-q-err"></textarea>
              <p class="field-err" id="faq-ask-q-err" role="alert"></p>
            </div>

            <div class="faq-ask-foot">
              <button class="btn btn-pri" id="faq-ask-send" type="submit"></button>
              <p class="hint faq-ask-note" id="faq-ask-note"></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

</main>

<footer id="sn-footer"></footer>
</body>
</html>
