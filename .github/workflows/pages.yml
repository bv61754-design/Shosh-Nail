name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/custom-nails-design-site-yc2op1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Turns GitHub Pages on for this repository if it is not already enabled,
      # so the site publishes without anyone touching the repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files, so the repository root is the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
