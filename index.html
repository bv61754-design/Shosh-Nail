<meta name="description" content="شوش نيل: صمّمي طقم أظافرك المركّبة من الصفر — الشكل والطول واللون والنقشة والزخارف — وشوفي التصميم قدّامك مباشرة، ويوصلك بمقاسك جاهز للّبس. Design your own press-on nail set and see it live.">

<style>
/* ---------------------------------------------------------------------
   Home-only layout. Every rule is prefixed .home-* and uses ONLY the
   tokens published in SPEC section 14, so it never collides with any
   other page and stays correct in both themes and both directions.
   Logical properties throughout — one rule serves RTL and LTR.
   --------------------------------------------------------------------- */

/* a class rule beats the UA sheet, so [hidden] needs saying out loud */
[hidden]{ display:none !important; }

/* ── reveal-on-scroll ─────────────────────────────────────────────────
   The class is added by home.js only when IntersectionObserver exists and
   the visitor has not asked for reduced motion, so content is never left
   invisible when JS or IO is unavailable. */
.home-rv{
  opacity:0;
  transform:translateY(18px);
  transition:opacity .24s var(--ease), transform .24s var(--ease);
  will-change:opacity, transform;
}
.home-rv.is-in{ opacity:1; transform:none; }
@media (prefers-reduced-motion:reduce){
  .home-rv,.home-rv.is-in{ opacity:1 !important; transform:none !important; }
}

/* ── hero ────────────────────────────────────────────────────────────── */
.home-hero{
  padding-block:clamp(28px,5vw,64px) clamp(44px,7vw,88px);
  overflow:hidden;
}
/* minmax(0,…) everywhere: the hero art is an <svg> with an intrinsic width of
   620, and an `auto` track would size itself to that and blow the page open
   on a phone. */
.home-hero-in{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:clamp(28px,4.5vw,54px);
  align-items:center;
}
@media (min-width:900px){
  .home-hero-in{ grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr); }
}
.home-hero-copy > * + *{ margin-block-start:16px; }
.home-hero-copy .eyebrow{ align-items:start; margin-block-end:0; }
.home-hero-copy .h1{ max-inline-size:15ch; }
.home-hero-copy .lead{ max-inline-size:56ch; }
.home-hero-btns{ margin-block-start:24px; }
@media (max-width:420px){
  .home-hero-btns{ flex-direction:column; align-items:stretch; }
  .home-hero-btns > .btn{ inline-size:100%; }
}

.home-notes{
  display:flex;
  flex-wrap:wrap;
  gap:8px 14px;
  margin-block-start:22px;
  list-style:none;
}
.home-note{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--ink-2);
  font-size:.85rem;
  font-weight:500;
  line-height:1.6;
}
.home-note .ico{ color:var(--rose-2); }

/* the live nail preview */
.home-hero-art{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  justify-items:center;
  align-items:center;
  min-inline-size:0;
}
.home-hero-art::before{
  content:"";
  position:absolute;
  inset-block-start:2%;
  inset-inline-start:50%;
  translate:-50% 0;
  inline-size:min(560px,104%);
  aspect-ratio:1/1;
  border-radius:50%;
  background:
    radial-gradient(closest-side,var(--glow-2),transparent 70%) 62% 28%/68% 68% no-repeat,
    radial-gradient(closest-side,var(--glow),transparent 72%);
  pointer-events:none;
}
.home-hero-stage{
  position:relative;
  z-index:1;
  inline-size:100%;
  min-inline-size:0;
  max-inline-size:520px;
}
.home-hero-stage > svg,.home-hero-stage > img{
  inline-size:100%;
  block-size:auto;
  filter:drop-shadow(0 22px 34px rgba(74,43,57,.16));
}
.home-hero-stage > img{
  border-radius:var(--r-lg);
  aspect-ratio:4/3;
  object-fit:cover;
}
@media (prefers-reduced-motion:no-preference){
  .home-float{ animation:home-float 7.5s var(--ease) infinite; }
  @keyframes home-float{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%    { transform:translateY(-13px) rotate(-.5deg); }
  }
}
@media (prefers-reduced-motion:reduce){
  .home-float{ animation:none !important; transform:none !important; }
}

/* ── stats strip ─────────────────────────────────────────────────────── */
.home-statsec{ padding-block:0; }
.home-stats{
  /* one equal-width row whatever the owner leaves in the collection */
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:minmax(0,1fr);
  align-items:center;
  gap:clamp(4px,2vw,18px);
  padding-block:clamp(20px,3vw,30px);
  padding-inline:clamp(8px,2.4vw,26px);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  background:linear-gradient(160deg,var(--bg-2),var(--bg-4));
  box-shadow:var(--sh-1);
  list-style:none;
}
.home-stat{
  position:relative;
  text-align:center;
  padding-inline:clamp(4px,1.6vw,14px);
  min-inline-size:0;
}
.home-stat + .home-stat::before{
  content:"";
  position:absolute;
  inset-block:14%;
  inset-inline-start:0;
  inline-size:1px;
  background:linear-gradient(180deg,transparent,var(--line-2),transparent);
}
.home-stat-v{
  display:block;
  font-size:clamp(1.55rem,5.4vw,2.7rem);
  font-weight:800;
  line-height:1.15;
  color:var(--rose-3);
  font-variant-numeric:tabular-nums;
  direction:ltr;
  unicode-bidi:isolate;
}
.home-stat-l{
  display:block;
  margin-block-start:6px;
  font-size:clamp(.72rem,2vw,.88rem);
  line-height:1.55;
  color:var(--ink-2);
  text-wrap:balance;
}

/* ── numbered steps ──────────────────────────────────────────────────── */
.home-step{ position:relative; padding-block-start:8px; }
.home-step-n{
  display:inline-grid;
  place-items:center;
  inline-size:46px;
  block-size:46px;
  margin-block-end:14px;
  border-radius:50%;
  background:var(--rose-soft);
  color:var(--rose-3);
  font-size:1.12rem;
  font-weight:800;
  line-height:1;
  font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 6px var(--bg);
}
.home-step-t{ font-size:1.05rem; font-weight:700; line-height:1.5; color:var(--ink); }
.home-step-x{ margin-block-start:8px; font-size:.9rem; line-height:1.8; color:var(--ink-2); }
/* the hairline that threads the four steps together on wide screens */
@media (min-width:1000px){
  .home-steps{ position:relative; }
  .home-steps::before{
    content:"";
    position:absolute;
    inset-inline:12%;
    inset-block-start:31px;
    block-size:2px;
    background:linear-gradient(90deg,transparent,var(--line-2),var(--line-2),transparent);
  }
  .home-step{ z-index:1; }
}

/* ── features ────────────────────────────────────────────────────────── */
.home-feat{ padding:clamp(18px,2.6vw,26px); }
.home-feat-ico{
  display:inline-grid;
  place-items:center;
  inline-size:50px;
  block-size:50px;
  margin-block-end:14px;
  border-radius:var(--r);
  background:linear-gradient(145deg,var(--rose-soft),var(--gold-soft));
  color:var(--rose-3);
}
.home-feat-t{ font-size:1.03rem; font-weight:700; line-height:1.5; color:var(--ink); }
.home-feat-x{ margin-block-start:8px; font-size:.9rem; line-height:1.8; color:var(--ink-2); }

/* ── design cards (markup shared with the shop) ──────────────────────── */
.home-card-btns{ margin-block-start:4px; flex-wrap:nowrap; }
.home-card-btns > .btn{ flex:1 1 0; min-inline-size:0; padding-inline:10px; }
.home-card-btns > .btn-ghost{ border-color:var(--line-2); }
.home-card-btns > .btn-ghost:hover{ border-color:var(--rose); color:var(--rose-3); }

/* ── colour teaser ───────────────────────────────────────────────────── */
.home-colors-in{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:clamp(20px,3vw,40px);
  align-items:center;
}
@media (min-width:860px){
  .home-colors-in{ grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); }
}
.home-colors-copy .eyebrow{ align-items:start; }
.home-sw-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:clamp(8px,1.4vw,12px);
  justify-content:center;
  /* caps the strip at nine per row so 18 shades read as two even bands */
  max-inline-size:508px;
  margin-inline:auto;
}
.home-sw{
  cursor:default;
  inline-size:clamp(30px,6.4vw,44px);
  block-size:clamp(30px,6.4vw,44px);
}
.home-sw:hover{ transform:none; }

/* ── testimonials ────────────────────────────────────────────────────── */
.home-quote{ padding:clamp(18px,2.6vw,26px); }
.home-quote-x{
  margin-block-start:12px;
  font-size:.95rem;
  line-height:1.9;
  color:var(--ink-2);
}
.home-quote-w{
  display:flex;
  align-items:center;
  gap:10px;
  margin-block-start:16px;
  padding-block-start:14px;
  border-block-start:1px solid var(--line);
}
.home-quote-av{
  display:grid;
  place-items:center;
  flex:0 0 auto;
  inline-size:38px;
  block-size:38px;
  border-radius:50%;
  background:var(--rose-soft);
  color:var(--rose-3);
  font-weight:800;
  font-size:.95rem;
  line-height:1;
}
.home-quote-n{ font-weight:700; color:var(--ink); font-size:.92rem; }

/* ── closing CTA band ────────────────────────────────────────────────── */
.home-band{
  position:relative;
  overflow:hidden;
  padding:clamp(30px,5.4vw,64px) clamp(20px,4vw,52px);
  border-radius:var(--r-xl);
  background:linear-gradient(135deg,var(--rose-2),var(--rose));
  color:var(--on-rose);
  text-align:center;
  box-shadow:var(--sh-2);
}
.home-band::before{
  content:"";
  position:absolute;
  inset-block-start:-40%;
  inset-inline-end:-12%;
  inline-size:min(420px,72%);
  aspect-ratio:1/1;
  border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent 70%);
  pointer-events:none;
}
.home-band > *{ position:relative; z-index:1; }
.home-band .h2,.home-band .lead{ color:var(--on-rose); }
.home-band .lead{
  max-inline-size:56ch;
  margin-inline:auto;
  margin-block-start:12px;
  opacity:.92;
}
.home-band .btns{ justify-content:center; margin-block-start:26px; }
.home-band .btn-pri{
  background:var(--bg-2);
  background-image:none;
  color:var(--rose-3);
  box-shadow:var(--sh-1);
}
.home-band .btn-pri:hover{ background:var(--bg-2); color:var(--rose-3); }
.home-band .btn-ghost{
  color:var(--on-rose);
  border:1px solid rgba(255,255,255,.55);
  background:transparent;
}
.home-band .btn-ghost:hover{ background:rgba(255,255,255,.14); color:var(--on-rose); }
</style>

<script defer src="assets/js/store.js"></script>

  <main id="main">

    <!-- ═══ 1. hero ═══════════════════════════════════════════════════ -->
    <section class="sec home-hero glow" aria-labelledby="home-hero-t">
      <div class="wrap home-hero-in">
        <div class="home-hero-copy">
          <p class="eyebrow" data-i18n="home.eyebrow"></p>
          <h1 class="h1 display" id="home-hero-t"></h1>
          <p class="lead" id="home-hero-sub"></p>
          <div class="btns home-hero-btns">
            <a class="btn btn-pri btn-lg" href="design.html" id="home-hero-cta"></a>
            <a class="btn btn-ghost btn-lg" href="shop.html" data-i18n="home.heroCta2"></a>
          </div>
          <ul class="home-notes" id="home-hero-notes"></ul>
        </div>
        <div class="home-hero-art" id="home-hero-art"></div>
      </div>
    </section>

    <!-- ═══ 2. stats strip ════════════════════════════════════════════ -->
    <section class="sec-sm home-statsec" aria-labelledby="home-stats-t">
      <h2 class="sr-only" id="home-stats-t" data-i18n="home.statsTitle"></h2>
      <div class="wrap">
        <ul class="home-stats" id="home-stats"></ul>
      </div>
    </section>

    <!-- ═══ 3. how it works ═══════════════════════════════════════════ -->
    <section class="sec" aria-labelledby="home-steps-t">
      <div class="wrap">
        <div class="sec-head">
          <p class="eyebrow" data-i18n="home.stepsEyebrow"></p>
          <h2 class="h2 display" id="home-steps-t" data-i18n="home.stepsTitle"></h2>

      </div>
    </section>

    <!-- ═══ 4. features ═══════════════════════════════════════════════ -->
    <section class="sec sec-alt" aria-labelledby="home-feat-t">
      <div class="wrap">
        <div class="sec-head">
          <p class="eyebrow" data-i18n="home.featEyebrow"></p>
          <h2 class="h2 display" id="home-feat-t" data-i18n="home.featTitle"></h2>
          <p class="lead" data-i18n="home.featSub"></p>
        </div>
        <div class="grid-4" id="home-features"></div>
      </div>
    </section>

    <!-- ═══ 5. most ordered ═══════════════════════════════════════════ -->
    <section class="sec" aria-labelledby="home-top-t">
      <div class="wrap">
        <div class="sec-head">
          <p class="eyebrow" data-i18n="home.topEyebrow"></p>
          <h2 class="h2 display" id="home-top-t" data-i18n="home.topTitle"></h2>
          <p class="lead" data-i18n="home.topSub"></p>
        </div>
        <div class="grid-4" id="home-top"></div>
        <p class="center mt-3">
          <a class="btn btn-line" href="shop.html" data-i18n="home.topAll"></a>
        </p>
      </div>
    </section>

    <!-- ═══ 6. colour teaser ══════════════════════════════════════════ -->
    <section class="sec sec-sm tint" aria-labelledby="home-col-t">
      <div class="wrap home-colors-in">
        <div class="home-colors-copy flow">
          <p class="eyebrow" data-i18n="home.colorsEyebrow"></p>
          <h2 class="h2 display" id="home-col-t" data-i18n="home.colorsTitle"></h2>
          <p class="lead" id="home-colors-sub"></p>
          <p><a class="btn btn-pri" href="design.html#step=4" data-i18n="home.colorsCta"></a></p>
        </div>
        <div class="home-sw-wrap" id="home-colors" aria-hidden="true"></div>
      </div>
    </section>

    <!-- ═══ 7. testimonials ═══════════════════════════════════════════ -->
    <section class="sec sec-alt" aria-labelledby="home-testi-t">
      <div class="wrap">
        <div class="sec-head">
          <p class="eyebrow" data-i18n="home.testiEyebrow"></p>
          <h2 class="h2 display" id="home-testi-t" data-i18n="home.testiTitle"></h2>
          <p class="lead" data-i18n="home.testiSub"></p>
        </div>
        <div class="grid-3" id="home-testimonials"></div>
      </div>
    </section>

    <!-- ═══ 8. closing CTA band ═══════════════════════════════════════ -->
    <section class="sec" aria-labelledby="home-band-t">
      <div class="wrap">
        <div class="home-band">
          <h2 class="h2 display" id="home-band-t" data-i18n="home.bandTitle"></h2>
          <p class="lead" data-i18n="home.bandText"></p>
          <div class="btns">
            <a class="btn btn-pri btn-lg" href="design.html" data-i18n="home.bandCta"></a>
            <a class="btn btn-ghost btn-lg" href="faq.html" data-i18n="home.bandCta2"></a>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer id="sn-footer"></footer>
